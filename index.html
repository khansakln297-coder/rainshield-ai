<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RainShield AI - West Bengal Live Resilience</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #070d19;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .header { margin-top: 5px; margin-bottom: 12px; }
    .header h1 { font-size: 22px; margin: 0; }
    .header p { font-size: 13px; color: #38bdf8; margin: 4px 0 0 0; font-weight: 600; }

    .control-card {
      width: 100%;
      max-width: 380px;
      background: #111a2e;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #0284c7;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .gps-btn {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border-radius: 7px;
      border: 1px solid #38bdf8;
      background: #1e293b;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .signal-circle {
      width: 135px;
      height: 135px;
      border-radius: 50%;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      transition: all 0.4s ease;
    }
    .safe { background: radial-gradient(circle, #22c55e 30%, #15803d 90%); box-shadow: 0 0 35px #22c55e99; }
    .watch { background: radial-gradient(circle, #eab308 30%, #a16207 90%); box-shadow: 0 0 35px #eab30899; }
    .danger { background: radial-gradient(circle, #ef4444 30%, #b91c1c 90%); box-shadow: 0 0 40px #ef4444aa; }

    .status-title { font-size: 19px; font-weight: 800; margin: 8px 0; }

    .voice-grid {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin: 10px 0;
    }
    .voice-btn {
      flex: 1;
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    .voice-btn.bn { background: #059669; }

    .info-card {
      background: #111a2e;
      padding: 14px;
      border-radius: 12px;
      max-width: 380px;
      width: 100%;
      font-size: 13px;
      line-height: 1.5;
      color: #e2e8f0;
      border: 1px solid #1e293b;
      box-sizing: border-box;
      text-align: left;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 380px;
      margin-top: 10px;
    }
    .metric-item {
      background: #0c1424;
      border: 1px solid #1e293b;
      padding: 8px 4px;
      border-radius: 8px;
    }
    .metric-label { font-size: 11px; color: #94a3b8; }
    .metric-data { font-size: 13px; font-weight: 800; color: #38bdf8; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌧️ RainShield AI</h1>
    <p>Live West Bengal Weather & Ground Alert</p>
  </div>

  <div class="control-card">
    <select id="districtSelect" onchange="onDistrictChange()">
      <optgroup label="Paschim Bardhaman (Local)">
        <option value="23.74,86.82" selected>Barakar (বরাকর)</option>
        <option value="23.73,86.85">Kulti (কুলটি)</option>
        <option value="23.68,86.98">Asansol (আসানসোল)</option>
        <option value="23.62,87.13">Raniganj (রানীগঞ্জ)</option>
        <option value="23.52,87.31">Durgapur (দুর্গাপুর)</option>
        <option value="23.70,87.08">Jamuria (জামুড়িয়া)</option>
        <option value="23.58,87.19">Andal (অন্ডাল)</option>
        <option value="23.86,86.87">Chittaranjan (চিত্তরঞ্জন)</option>
      </optgroup>
      <optgroup label="Rarh & Paschim Jile">
        <option value="23.24,87.86">Purba Bardhaman</option>
        <option value="23.91,87.53">Birbhum (Suri/Bolpur)</option>
        <option value="23.23,87.07">Bankura</option>
        <option value="23.33,86.36">Purulia</option>
        <option value="22.42,87.32">Paschim Medinipur</option>
        <option value="22.45,86.98">Jhargram</option>
      </optgroup>
      <optgroup label="South Bengal & Coastal">
        <option value="22.57,88.36">Kolkata</option>
        <option value="22.59,88.26">Howrah</option>
        <option value="22.90,88.39">Hooghly</option>
        <option value="22.72,88.48">North 24 Parganas</option>
        <option value="22.15,88.45">South 24 Parganas</option>
        <option value="23.47,88.55">Nadia</option>
        <option value="24.18,88.27">Murshidabad</option>
        <option value="21.93,87.77">Purba Medinipur (Digha)</option>
      </optgroup>
      <optgroup label="North Bengal & Hills">
        <option value="25.00,88.14">Malda</option>
        <option value="25.62,88.12">Uttar Dinajpur</option>
        <option value="25.22,88.76">Dakshin Dinajpur</option>
        <option value="27.04,88.26">Darjeeling</option>
        <option value="27.06,88.47">Kalimpong</option>
        <option value="26.54,88.72">Jalpaiguri</option>
        <option value="26.49,89.53">Alipurduar</option>
        <option value="26.32,89.45">Cooch Behar</option>
      </optgroup>
    </select>
    <button class="gps-btn" onclick="useGPS()">📍 Ghar Ki Live Location Se Check Karein</button>
  </div>

  <div id="signal" class="signal-circle watch">⏳</div>
  <div id="title" class="status-title" style="color: #eab308;">Loading Weather...</div>

  <div class="voice-grid">
    <button class="voice-btn" onclick="speakAlert('hi-IN')">🔊 Hindi Alert</button>
    <button class="voice-btn bn" onclick="speakAlert('bn-IN')">📢 বাংলা সতর্কবার্তা</button>
  </div>

  <div class="info-card" id="advisory">
    Live radar data load ho raha hai...
  </div>

  <div class="metrics-grid">
    <div class="metric-item">
      <div class="metric-label">Badal (Cloud)</div>
      <div id="cloudVal" class="metric-data">--%</div>
    </div>
    <div class="metric-item">
      <div class="metric-label">Barish Chance</div>
      <div id="rainProb" class="metric-data">--%</div>
    </div>
    <div class="metric-item">
      <div class="metric-label">Rainfall</div>
      <div id="rainRate" class="metric-data">0.0 mm</div>
    </div>
    <div class="metric-item">
      <div class="metric-label">Hawa Gati</div>
      <div id="windVal" class="metric-data">-- km/h</div>
    </div>
  </div>

  <script>
    let speechHindi = "";
    let speechBengali = "";

    function speakAlert(langCode) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = (langCode === 'bn-IN') ? speechBengali : speechHindi;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = langCode;
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }
    }

    async function fetchDistrictWeather(lat, lon, placeName) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=precipitation,rain,cloud_cover,wind_speed_10m&hourly=precipitation_probability`;
        const res = await fetch(url);
        const data = await res.json();

        const currentRain = data.current.precipitation || 0;
        const cloudCover = data.current.cloud_cover || 0;
        const wind = data.current.wind_speed_10m || 0;
        const prob = (data.hourly && data.hourly.precipitation_probability) ? data.hourly.precipitation_probability[0] : 0;

        document.getElementById('cloudVal').innerText = cloudCover + "%";
        document.getElementById('rainProb').innerText = prob + "%";
        document.getElementById('rainRate').innerText = currentRain + " mm";
        document.getElementById('windVal').innerText = wind + " km/h";

        const sig = document.getElementById("signal");
        const tit = document.getElementById("title");
        const adv = document.getElementById("advisory");

        if (currentRain > 0.4 || prob >= 65) {
          sig.className = "signal-circle danger";
          sig.innerText = "🔴";
          tit.style.color = "#ef4444";
          tit.innerText = `${placeName}: KHATRA (LAAL)`;
          adv.innerHTML = `<strong>⚠️ Bhari Barish Warning!</strong> ${placeName} me tez barish aur sadak par paani bharne ki sambhavna hai. Rehedi-patri aur saman unche sthan par rakhein.<br><br><strong>বাংলা:</strong> ${placeName} এলাকায় ভারী বৃষ্টির সতর্কতা! জল জমতে পারে, নিরাপদ আশ্রয়ে থাকুন।`;
          speechHindi = `Khatra hai, laal signal. ${placeName} me bhari barish ki aashanka hai. Unchi jagah jayein.`;
          speechBengali = `Bipod, laal signal. ${placeName} elakay bhari brishti hote pare. Nirapad sthane jaan.`;
        } else if (cloudCover > 50 || prob >= 25) {
          sig.className = "signal-circle watch";
          sig.innerText = "🟡";
          tit.style.color = "#f59e0b";
          tit.innerText = `${placeName}: SACHET (PEELA)`;
          adv.innerHTML = `<strong>☁️ Badal Chhaye Hain (${cloudCover}%).</strong> ${placeName} me halki barish ho sakti hai. Tirpal aur cover taiyar rakhein.<br><br><strong>বাংলা:</strong> ${placeName} এলাকায় আকাশ মেঘলা। বৃষ্টির সম্ভাবনা রয়েছে, ত্রিপল তৈরি রাখুন।`;
          speechHindi = `Dhyan dein, peela signal. ${placeName} me badal hain, barish ho sakti hai. Tirpal taiyar rakhein.`;
          speechBengali = `Satarka thakun, holud signal. ${placeName} elakay brishti hote pare. Tirpol toiri rakhun.`;
        } else {
          sig.className = "signal-circle safe";
          sig.innerText = "🟢";
          tit.style.color = "#22c55e";
          tit.innerText = `${placeName}: SURAKSHIT (HARA)`;
          adv.innerHTML = `<strong>☀️ Mausam Normal Hai.</strong> ${placeName} me sthiti surakshit hai, dukan aur aam kaam bina rukawat chalayein.<br><br><strong>বাংলা:</strong> ${placeName} এলাকায় আবহাওয়া স্বাভাবিক ও নিরাপদ রয়েছে।`;
          speechHindi = `Surakshit hai, hara signal. ${placeName} me mausam saaf hai.`;
          speechBengali = `Nirapad, shobuj signal. ${placeName} elakay abhawa porishkar achhe.`;
        }
      } catch (e) {
        document.getElementById("advisory").innerText = "Data fetch me dikkat aayi. Network check karein.";
      }
    }

    function onDistrictChange() {
      const select = document.getElementById("districtSelect");
      const [lat, lon] = select.value.split(",");
      const placeName = select.options[select.selectedIndex].text.split("(")[0].trim();
      fetchDistrictWeather(lat, lon, placeName);
    }

    function useGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          fetchDistrictWeather(pos.coords.latitude, pos.coords.longitude, "Aapka Ghar (Live Area)");
        }, () => onDistrictChange());
      } else {
        onDistrictChange();
      }
    }

    onDistrictChange();
  </script>
</body>
</html>
