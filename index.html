<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RainShield AI - West Bengal Live Weather Alert</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #090e1a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .header { margin-top: 5px; margin-bottom: 12px; }
    .header h1 { font-size: 22px; margin: 0; }
    .header p { font-size: 13px; color: #38bdf8; margin: 4px 0 0 0; font-weight: 600; }
    .selector-box {
      width: 100%;
      max-width: 340px;
      background: #131d33;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      margin-bottom: 10px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .gps-btn {
      margin-top: 8px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }
    .signal-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin: 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      transition: all 0.4s ease;
    }
    .safe { background: radial-gradient(circle, #22c55e 30%, #15803d 90%); box-shadow: 0 0 35px #22c55e99; }
    .watch { background: radial-gradient(circle, #eab308 30%, #a16207 90%); box-shadow: 0 0 35px #eab30899; }
    .danger { background: radial-gradient(circle, #ef4444 30%, #b91c1c 90%); box-shadow: 0 0 40px #ef4444aa; }
    .status-title { font-size: 19px; font-weight: 800; margin: 8px 0; }
    .btn-group { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 340px; margin: 10px 0; }
    .voice-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    .bengali-btn { background: #059669; }
    .info-box {
      background: #131d33;
      padding: 12px;
      border-radius: 10px;
      max-width: 340px;
      font-size: 13px;
      line-height: 1.5;
      color: #e2e8f0;
      border: 1px solid #1e293b;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 340px;
      margin-top: 10px;
      font-size: 12px;
    }
    .metric-card {
      background: #111d38;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .metric-val { font-size: 15px; font-weight: bold; color: #38bdf8; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌧️ RainShield AI</h1>
    <p>West Bengal Community Real-Time Weather</p>
  </div>

  <div class="selector-box">
    <select id="districtSelect" onchange="onDistrictChange()">
      <option value="23.68,86.98" selected>Paschim Bardhaman (Asansol / Durgapur)</option>
      <option value="23.24,87.86">Purba Bardhaman</option>
      <option value="22.57,88.36">Kolkata</option>
      <option value="22.59,88.26">Howrah</option>
      <option value="22.90,88.39">Hooghly</option>
      <option value="22.72,88.48">North 24 Parganas</option>
      <option value="22.15,88.45">South 24 Parganas</option>
      <option value="23.47,88.55">Nadia</option>
      <option value="24.18,88.27">Murshidabad</option>
      <option value="23.91,87.53">Birbhum</option>
      <option value="23.23,87.07">Bankura</option>
      <option value="23.33,86.36">Purulia</option>
      <option value="22.42,87.32">Paschim Medinipur</option>
      <option value="21.93,87.77">Purba Medinipur</option>
      <option value="22.45,86.98">Jhargram</option>
      <option value="25.00,88.14">Malda</option>
      <option value="25.62,88.12">Uttar Dinajpur</option>
      <option value="25.22,88.76">Dakshin Dinajpur</option>
      <option value="27.04,88.26">Darjeeling</option>
      <option value="27.06,88.47">Kalimpong</option>
      <option value="26.54,88.72">Jalpaiguri</option>
      <option value="26.49,89.53">Alipurduar</option>
      <option value="26.32,89.45">Cooch Behar</option>
    </select>
    <button class="gps-btn" onclick="useGPS()">📍 Meri Live GPS Location Se Check Karein</button>
  </div>

  <div id="signal" class="signal-circle watch">⏳</div>
  <div id="title" class="status-title" style="color: #eab308;">Satellite Syncing...</div>

  <div class="btn-group">
    <button class="voice-btn" onclick="speakAlert('hi-IN')">🔊 Hindi Mein Sunein</button>
    <button class="voice-btn bengali-btn" onclick="speakAlert('bn-IN')">📢 বাংলায় শুনুন (Bengali)</button>
  </div>

  <div class="info-box" id="advisory">Mausam data fetch ho raha hai...</div>

  <div class="metrics">
    <div class="metric-card"><div>Cloud Cover</div><div id="cloudVal" class="metric-val">--%</div></div>
    <div class="metric-card"><div>Rain Chance</div><div id="rainProb" class="metric-val">--%</div></div>
    <div class="metric-card"><div>Current Rain</div><div id="rainRate" class="metric-val">0.0 mm</div></div>
    <div class="metric-card"><div>Wind Speed</div><div id="windVal" class="metric-val">-- km/h</div></div>
  </div>

  <script>
    let speechHindi = "";
    let speechBengali = "";

    function speakAlert(langCode) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(langCode === 'bn-IN' ? speechBengali : speechHindi);
        utter.lang = langCode;
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }
    }

    async function fetchDistrictWeather(lat, lon, districtName) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=precipitation,rain,cloud_cover,wind_speed_10m&hourly=precipitation_probability`);
        const data = await res.json();
        const currentRain = data.current.precipitation || 0;
        const cloudCover = data.current.cloud_cover || 0;
        const wind = data.current.wind_speed_10m || 0;
        const prob = data.hourly.precipitation_probability ? data.hourly.precipitation_probability[0] : 0;

        document.getElementById('cloudVal').innerText = cloudCover + "%";
        document.getElementById('rainProb').innerText = prob + "%";
        document.getElementById('rainRate').innerText = currentRain + " mm";
        document.getElementById('windVal').innerText = wind + " km/h";

        const sig = document.getElementById("signal");
        const tit = document.getElementById("title");
        const adv = document.getElementById("advisory");

        if (currentRain > 0.4 || prob >= 65) {
          sig.className = "signal-circle danger";
          sig.innerText = "🔴";
          tit.style.color = "#ef4444";
          tit.innerText = `${districtName}: KHATRA (LAAL)`;
          adv.innerHTML = `<strong>Bhari Barish Warning!</strong> ${districtName} me tez barish ka khatra hai. Unchi jagah par jayein.<br><br><strong>বাংলা:</strong> ${districtName} এলাকায় ভারী বৃষ্টির সতর্কতা! নিরাপদ স্থানে থাকুন।`;
          speechHindi = `Khatra hai, laal signal. ${districtName} me bhari barish ki aashanka hai. Unchi jagah jayein.`;
          speechBengali = `Bipod, laal signal. ${districtName} elakay bhari brishti hote pare. Nirapad sthane jaan.`;
        } else if (cloudCover > 50 || prob >= 25) {
          sig.className = "signal-circle watch";
          sig.innerText = "🟡";
          tit.style.color = "#f59e0b";
          tit.innerText = `${districtName}: SACHET (PEELA)`;
          adv.innerHTML = `<strong>Badal Chhaye Hain (${cloudCover}%).</strong> ${districtName} me halki barish ho sakti hai. Tirpal taiyar rakhein.<br><br><strong>বাংলা:</strong> ${districtName} এলাকায় আকাশ মেঘলা। ত্রিপল তৈরি রাখুন।`;
          speechHindi = `Dhyan dein, peela signal. ${districtName} me badal hain, tirpal taiyar rakhein.`;
          speechBengali = `Satarka thakun, holud signal. ${districtName} elakay brishti hote pare. Tirpol toiri rakhun.`;
        } else {
          sig.className = "signal-circle safe";
          sig.innerText = "🟢";
          tit.style.color = "#22c55e";
          tit.innerText = `${districtName}: SURAKSHIT (HARA)`;
          adv.innerHTML = `<strong>Mausam Normal Hai.</strong> ${districtName} me sthiti surakshit hai.<br><br><strong>বাংলা:</strong> ${districtName} এলাকায় আবহাওয়া স্বাভাবিক।`;
          speechHindi = `Surakshit hai, hara signal. ${districtName} me mausam saaf hai.`;
          speechBengali = `Nirapad, shobuj signal. ${districtName} elakay abhawa porishkar.`;
        }
      } catch (e) {
        document.getElementById("advisory").innerText = "Data load nahi ho saka. Connection check karein.";
      }
    }

    function onDistrictChange() {
      const select = document.getElementById("districtSelect");
      const [lat, lon] = select.value.split(",");
      const districtName = select.options[select.selectedIndex].text.split("(")[0].trim();
      fetchDistrictWeather(lat, lon, districtName);
    }

    function useGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          fetchDistrictWeather(pos.coords.latitude, pos.coords.longitude, "Aapka Live Area");
        }, () => onDistrictChange());
      } else {
        onDistrictChange();
      }
    }

    onDistrictChange();
  </script>
</body>
</html>
